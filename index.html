<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e4c2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Чекпоинты">
  <title>Чекпоинты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3e7a'/%3E%3Cpath fill='white' d='M32 6c1.6 0 2.8 3 2.8 8v7l12 4c7 2 9 6 9 10l-1 4-20-3v9l7 5v4l-10-3-10 3v-4l7-5v-9l-20 3-1-4c0-4 2-8 9-10l12-4v-7c0-5 1.2-8 2.8-8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3e4c2;
      --ink: #1f3e7a;
      --muted: #5c7094;
      --cyan: #7ac9d8;
      --cyan-edge: #4c97a6;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: "Nunito", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-tap-highlight-color: transparent;
    }

    body.locked { overflow: hidden; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("assets/sky.svg") center / cover no-repeat;
    }

    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .sheet {
      position: relative;
      width: min(440px, 100%, max(300px, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 8px) * 390 / 780)));
      margin-block: auto;
      user-select: none;
    }

    .sheet svg.map {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .title {
      position: absolute;
      z-index: 3;
      left: 3.5%;
      top: 1.6%;
      margin: 0;
      pointer-events: none;
      background: rgba(251, 246, 234, 0.94);
      border-radius: 18px;
      padding: 8px 12px 9px;
      box-shadow: 0 8px 18px rgba(40, 50, 70, 0.08);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(18px, 5vw, 25px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .title p {
      margin: 3px 0 0;
      font-size: clamp(11px, 2.9vw, 13px);
      font-weight: 800;
      color: var(--muted);
    }

    .cp {
      position: absolute;
      z-index: 4;
      left: 0;
      top: 0;
      width: 15%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 3px solid var(--cyan-edge);
      border-radius: 50%;
      padding: 0;
      background: var(--cyan);
      color: #fff;
      font: inherit;
      font-weight: 900;
      font-size: clamp(20px, 6.4vw, 30px);
      line-height: 1;
      letter-spacing: -0.04em;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow:
        inset 0 -3px 0 rgba(32, 110, 130, 0.18),
        0 2px 0 rgba(20, 40, 60, 0.1),
        0 7px 12px rgba(20, 40, 70, 0.14);
      touch-action: manipulation;
    }

    .cp:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .cp:hover { transform: translate(-50%, -50%) scale(1.06); }
    }

    .cp:active { transform: translate(-50%, -50%) scale(0.95); }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #102033 url("assets/crew.jpg") center / cover no-repeat;
      overscroll-behavior: contain;
    }

    #stage.is-stub::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 16, 28, 0.58);
      z-index: 1;
    }

    #close {
      position: absolute;
      z-index: 5;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.95);
      color: #1a2744;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      touch-action: manipulation;
    }

    #close svg { width: 22px; height: 22px; display: block; }

    #close:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    #video {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: transparent;
      object-fit: contain;
      max-height: 100%;
    }

    #spinner,
    #replay {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    #replay {
      border: 0;
      background: rgba(255, 250, 242, 0.96);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      font-size: 18px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      touch-action: manipulation;
    }

    #stub {
      position: relative;
      z-index: 2;
      width: min(86vw, 340px);
      margin: 24px;
      background: #fffaf2;
      color: var(--ink);
      border-radius: 28px;
      padding: 26px 22px 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .stub-plane {
      width: 54px;
      height: 54px;
      display: block;
      margin: 0 auto 8px;
      fill: var(--ink);
    }

    #stub .eyebrow {
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
      color: #3d86a2;
    }

    #stub h2 {
      margin: 8px 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 900;
    }

    #stub .note {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.4;
      color: var(--muted);
    }

    #back, #video-error {
      font: inherit;
    }

    #back {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #back:focus-visible,
    #replay:focus-visible {
      outline: 3px solid #7ac9d8;
      outline-offset: 3px;
    }

    #video-error {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 250, 242, 0.95);
      color: #8d2d2d;
      font-weight: 800;
      text-align: center;
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
      .cp, .cp:hover, .cp:active { transition: none; }
    }
  </style>
</head>

    </button>

    <div id="spinner" hidden></div>
    <button id="replay" type="button" hidden>Ещё раз</button>

      </svg>
      <p class="eyebrow">Чекпоинт <span id="stub-num">2</span></p>
      <h2>Видео ещё в пути</h2>
      <p class="note">Ролик для этой точки появится позже.</p>
      <button id="back" type="button">На карту</button>

  <script>
    const videos = {
      1: "assets/videoplanes.mp4"
    };

    const stage = document.querySelector("#stage");
    const video = document.querySelector("#video");
    const stub = document.querySelector("#stub");
    const spinner = document.querySelector("#spinner");
    const replay = document.querySelector("#replay");
    const stubNum = document.querySelector("#stub-num");
    const videoError = document.querySelector("#video-error");
    const theme = document.querySelector('meta[name="theme-color"]');
    let open = false;
    let closing = false;

    document.querySelectorAll(".cp").forEach((button) => {
      const n = button.dataset.n;
      button.setAttribute(
        "aria-label",
        n === "1" ? "Чекпоинт 1, смотреть видео" : `Чекпоинт ${n}`
      );
      button.addEventListener("click", () => openCheckpoint(Number(n)));
    });

    function layoutVideo() {
      if (!open || video.hidden || !video.videoWidth) return;
      const bounds = stage.getBoundingClientRect();
      const ratio = video.videoWidth / video.videoHeight;
      let width = bounds.width;
      let height = width / ratio;
      if (height > bounds.height) {
        height = bounds.height;
        width = height * ratio;
      }
      video.style.width = width + "px";
      video.style.height = height + "px";
    }

    function showCheckpoint(n) {
      open = true;
      closing = false;
      document.body.classList.add("locked");
      stage.hidden = false;
      replay.hidden = true;
      videoError.hidden = true;
      theme.setAttribute("content", "#102033");
      const src = videos[n];
      if (src) {
        stage.classList.remove("is-stub");
        stub.hidden = true;
        video.hidden = false;
        spinner.hidden = false;
        if (video.getAttribute("src") !== src) video.src = src;
        else video.currentTime = 0;
        layoutVideo();
        const attempt = video.play();
        if (attempt) attempt.catch(() => { spinner.hidden = true; });
      } else {
        video.pause();
        stage.classList.add("is-stub");
        video.hidden = true;
        spinner.hidden = true;
        stub.hidden = false;
        stubNum.textContent = String(n);
      }
      document.querySelector("#close").focus();
    }

    function hideStage() {
      if (!open) return;
      open = false;
      video.pause();
      stage.hidden = true;
      stage.classList.remove("is-stub");
      document.body.classList.remove("locked");
      theme.setAttribute("content", "#f3e4c2");
    }

    function openCheckpoint(n) {
      showCheckpoint(n);
      if (!history.state || history.state.cp == null) history.pushState({ cp: n }, "");
      else history.replaceState({ cp: n }, "");
    }

    function requestClose() {
      if (!open || closing) return;
      if (history.state && history.state.cp != null) {
        closing = true;
        history.back();
      } else {
        hideStage();
      }
    }

    document.querySelector("#close").addEventListener("click", requestClose);
    document.querySelector("#back").addEventListener("click", requestClose);
    document.querySelector("#replay").addEventListener("click", () => {
      video.currentTime = 0;
      video.play();
    });

    video.addEventListener("loadedmetadata", layoutVideo);
    video.addEventListener("playing", () => { spinner.hidden = true; replay.hidden = true; });
    video.addEventListener("play", () => { replay.hidden = true; });
    video.addEventListener("ended", () => { replay.hidden = false; });
    video.addEventListener("error", () => {
      spinner.hidden = true;
      if (open && !video.hidden) videoError.hidden = false;
    });
    window.addEventListener("resize", layoutVideo);
    window.addEventListener("popstate", () => {
      closing = false;
      hideStage();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && open) requestClose();
    });
  </script>
</body>
</html>
