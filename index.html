<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b9e7f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Чекпоинты">
  <title>Чекпоинты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23145680'/%3E%3Cpath fill='white' d='M32 6c1.6 0 2.8 3 2.8 8v7l12 4c7 2 9 6 9 10l-1 4-20-3v9l7 5v4l-10-3-10 3v-4l7-5v-9l-20 3-1-4c0-4 2-8 9-10l12-4v-7c0-5 1.2-8 2.8-8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #b9e7f6;
      --ink: #143d5c;
      --muted: #3d6d88;
      --line: #14608a;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      font-family: "Nunito", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      -webkit-tap-highlight-color: transparent;
    }

    body.locked { overflow: hidden; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .route {
      position: relative;
      width: min(440px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
      user-select: none;
    }

    .line {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .cp {
      position: absolute;
      z-index: 1;
      left: 50%;
      width: fit-content;
      max-width: calc(100% - 24px);
      border: 0;
      border-radius: 18px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      font-size: clamp(14px, 3.8vw, 17px);
      line-height: 1.25;
      text-align: center;
      translate: -50% 0;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(16, 70, 100, 0.12);
      touch-action: manipulation;
    }

    .mark {
      position: absolute;
      bottom: calc(100% + 4px);
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 5px 12px rgba(16, 70, 100, 0.18);
      pointer-events: none;
    }

    .cp[data-side="left"] .mark { left: 0; }
    .cp[data-side="right"] .mark { right: 0; }

    .mark svg {
      display: block;
      width: 34px;
      height: 34px;
      overflow: visible;
    }

    .cp:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .cp:hover { scale: 1.03; }
    }

    .cp:active { scale: 0.98; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    #stage.is-stub::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(16, 55, 80, 0.22);
      z-index: 1;
    }

    #stage.is-stub .film {
      display: none;
    }

    #close {
      position: absolute;
      z-index: 5;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      touch-action: manipulation;
    }

    #close svg { width: 22px; height: 22px; display: block; }

    #close:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .film {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: transparent;
      object-fit: contain;
      max-height: 100%;
    }

    #spinner,
    #replay {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(20, 61, 92, 0.2);
      border-top-color: var(--ink);
      animation: spin 0.8s linear infinite;
    }

    #replay {
      border: 0;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      font-size: 18px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      touch-action: manipulation;
    }

    #stub {
      position: relative;
      z-index: 2;
      width: min(86vw, 340px);
      margin: 24px;
      background: #f7fcff;
      color: var(--ink);
      border-radius: 28px;
      padding: 26px 22px 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(16, 55, 80, 0.22);
    }

    .stub-plane {
      width: 54px;
      height: 54px;
      display: block;
      margin: 0 auto 8px;
      fill: var(--ink);
    }

    #stub .eyebrow {
      margin: 0;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.3;
      color: #1d6f96;
    }

    #stub h2 {
      margin: 8px 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 900;
    }

    #stub .note {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.4;
      color: var(--muted);
    }

    #back, #video-error {
      font: inherit;
    }

    #back {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #back:focus-visible,
    #replay:focus-visible {
      outline: 3px solid #7ac9d8;
      outline-offset: 3px;
    }

    #video-error {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #8d2d2d;
      font-weight: 800;
      text-align: center;
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
      .cp, .cp:hover, .cp:active { transition: none; }
    }
  </style>
</head>
<body>
  <main class="route">
    <h1 class="sr-only">Чекпоинты</h1>
    <svg class="line" aria-hidden="true" focusable="false">
      <path fill="none" stroke="#14608a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10"/>
    </svg>
    <button class="cp" type="button" data-n="1" data-side="left">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3.5" y="3.5" width="25" height="25" rx="4" fill="#14608a"/><path d="M12.2 23.6V8.6h6.2a4.7 4.7 0 0 1 0 9.4h-6.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="name">Парковка для семей с детьми</span>
    </button>
    <button class="cp" type="button" data-n="2" data-side="right">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 26V12a8 8 0 0 1 16 0v14"/><path d="M8 17.5h16"/><circle cx="16" cy="17.5" r="1.3" fill="currentColor" stroke="none"/></svg></span>
      <span class="name">Входной досмотр</span>
    </button>
    <button class="cp" type="button" data-n="3" data-side="left">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="6" width="16" height="12" rx="2"/><path d="M11.5 11h9M11.5 14.5h5.5"/><path d="M6 23h20M9 23v3M23 23v3"/></svg></span>
      <span class="name">Регистрация</span>
    </button>
    <button class="cp" type="button" data-n="4" data-side="right">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="2.5"/><path d="M7.2 25v-3.4a4.8 4.8 0 0 1 9.6 0V25"/><circle cx="22.6" cy="12.2" r="1.9"/><path d="M19.2 25v-2.4a3.4 3.4 0 0 1 6.8 0V25"/></svg></span>
      <span class="name">Комната матери и ребенка</span>
    </button>
    <button class="cp" type="button" data-n="5" data-side="left">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13h18l-2 11H9L7 13z"/><path d="M5.5 13h21"/><path d="M12 13V8.5h8V13"/></svg></span>
      <span class="name">Предполетный досмотр</span>
    </button>
    <button class="cp" type="button" data-n="6" data-side="right">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 11V7.5h5"/><path d="M11 11h11l2 8H10.5L11 11z"/><circle cx="13" cy="23.5" r="2.1"/><circle cx="21.5" cy="23.5" r="2.1"/></svg></span>
      <span class="name">Сервисы для пассажиров с детьми</span>
    </button>
    <button class="cp" type="button" data-n="7" data-side="left">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h8.5L18 12h4l-3.2 6H25l2.2 2.2h-4.2L21 25h-3.2l2-4.8H4z" fill="currentColor" stroke="none"/><path d="M23 7.5l3.2 3.2L29.4 7.5"/></svg></span>
      <span class="name">Приоритетная посадка в самолет</span>
    </button>
    <button class="cp" type="button" data-n="8" data-side="right">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 25h22"/><path d="M7 20.5 18 10l3.2 1.2-4.4 9.3H23l2.2 2H7z" fill="currentColor" stroke="none"/></svg></span>
      <span class="name">Зона прилета</span>
    </button>
    <button class="cp" type="button" data-n="9" data-side="right">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="2.6"/><path d="M9.5 26v-4.2a6.5 6.5 0 0 1 13 0V26"/><path d="M16 14.2c.7-1.3 2.5-1.6 3.4-.4.8 1 .4 2.2-1.1 3.5L16 19.2l-2.3-1.9c-1.5-1.3-1.9-2.5-1.1-3.5.9-1.2 2.7-.9 3.4.4z" fill="currentColor" stroke="none"/></svg></span>
      <span class="name">Комплексная поддержка пассажиров с детьми</span>
    </button>
  </main>

  <div id="stage" hidden>
    <button id="close" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="film">
      <video id="video" hidden playsinline webkit-playsinline controls preload="auto"></video>
      <div id="spinner" hidden></div>
      <button id="replay" type="button" hidden>Ещё раз</button>
    </div>
    <p id="video-error" hidden>Не удалось открыть видео</p>
    <div id="stub" hidden>
      <svg class="stub-plane" viewBox="-32 -34 64 68" aria-hidden="true">
        <path d="M0-30c2 0 3.4 4 3.4 12l.2 8 13-4c8-2 14 2 14 8l-1 4-25 3v8l8 5v3l-10-3-10 3v-3l8-5v-8l-25-3-1-4c0-6 6-10 14-8l13 4 .2-8c0-8 1.4-12 3.4-12z"/>
      </svg>
      <p class="eyebrow" id="stub-name">Входной досмотр</p>
      <h2>Видео ещё в пути</h2>
      <p class="note">Ролик для этой точки появится позже.</p>
      <button id="back" type="button">На карту</button>
    </div>
  </div>

  <script>
    const videos = {
      1: "assets/videoplanes.mp4"
    };

    const stage = document.querySelector("#stage");
    const video = document.querySelector("#video");
    const stub = document.querySelector("#stub");
    const spinner = document.querySelector("#spinner");
    const replay = document.querySelector("#replay");
    const stubName = document.querySelector("#stub-name");
    const videoError = document.querySelector("#video-error");
    const theme = document.querySelector('meta[name="theme-color"]');
    const route = document.querySelector(".route");
    const line = document.querySelector(".line");
    let open = false;
    let closing = false;

    const labels = new Map();
    const ruler = document.createElement("span");
    ruler.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;pointer-events:none;";
    document.body.appendChild(ruler);

    const shifts = { 1: -24, 2: 62, 3: -76, 4: 30, 5: -48, 6: 38, 7: -16, 8: 70, 9: 44 };
    const gapWeights = [1.4, 0.58, 1.62, 0.74, 1.3, 0.52, 1.48, 0.96];

    document.querySelectorAll(".cp").forEach((button) => {
      const n = button.dataset.n;
      const label = button.querySelector(".name").textContent.trim();
      labels.set(button, label);
      button.setAttribute("aria-label", n === "1" ? label + ", смотреть видео" : label);
      button.addEventListener("click", () => openCheckpoint(Number(n)));
    });

    function measure(text, button) {
      ruler.textContent = text;
      ruler.style.font = getComputedStyle(button).font;
      return ruler.offsetWidth;
    }

    function fitLabel(button) {
      const words = labels.get(button).split(/\s+/);
      const style = getComputedStyle(button);
      const pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const limit = Math.min(route.clientWidth - 88, 260);
      const lineOf = (list) => measure(list.join(" "), button);
      button.style.maxWidth = "none";
      const name = button.querySelector(".name");
      const hug = () => {
        const range = document.createRange();
        range.selectNodeContents(name);
        const widest = Math.max(...[...range.getClientRects()].map((rect) => rect.width).filter((width) => width > 2));
        button.style.width = Math.ceil(widest + pad) + "px";
      };
      if (words.length < 2 || lineOf(words) + pad <= limit) {
        name.replaceChildren(document.createTextNode(labels.get(button)));
        button.style.width = Math.ceil(lineOf(words) + pad + 8) + "px";
        hug();
        return;
      }
      let best = Infinity;
      let split = 1;
      for (let i = 1; i < words.length; i++) {
        const widest = Math.max(lineOf(words.slice(0, i)), lineOf(words.slice(i)));
        if (widest < best) {
          best = widest;
          split = i;
        }
      }
      name.replaceChildren(
        document.createTextNode(words.slice(0, split).join(" ")),
        document.createElement("br"),
        document.createTextNode(words.slice(split).join(" "))
      );
      button.style.width = Math.ceil(best + pad + 8) + "px";
      hug();
    }

    function layoutStops() {
      document.querySelectorAll(".cp").forEach(fitLabel);
      const padTop = parseFloat(getComputedStyle(route).paddingTop);
      const padBottom = parseFloat(getComputedStyle(route).paddingBottom);
      const ids = [9, 8, 7, 6, 5, 4, 3, 2, 1];
      const buttons = ids.map((id) => document.querySelector(`.cp[data-n="${id}"]`));
      const heights = buttons.map((button) => button.offsetHeight);
      const iconH = 46;
      const inner = route.clientHeight - padTop - padBottom;
      const free = Math.max(0, inner - heights.reduce((sum, height) => sum + height, 0) - iconH * buttons.length);
      const weightSum = gapWeights.reduce((sum, weight) => sum + weight, 0);
      const half = route.clientWidth / 2;
      let y = padTop;
      buttons.forEach((button, index) => {
        const room = Math.max(0, half - button.offsetWidth / 2 - 12);
        const x = Math.max(-room, Math.min(room, shifts[ids[index]]));
        button.style.top = (y + iconH) + "px";
        button.style.translate = `calc(-50% + ${x}px) 0`;
        button.dataset.side = x < 0 ? "left" : "right";
        y += iconH + heights[index];
        if (index < gapWeights.length) y += free * gapWeights[index] / weightSum;
      });
      layoutLine();
    }

    function layoutLine() {
      const box = route.getBoundingClientRect();
      const points = [...document.querySelectorAll(".cp")]
        .sort((a, b) => Number(a.dataset.n) - Number(b.dataset.n))
        .map((button) => {
          const rect = button.getBoundingClientRect();
          return {
            x: rect.left + rect.width / 2 - box.left,
            y: rect.top + rect.height / 2 - box.top
          };
        });
      const tension = 0.28;
      let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || points[i + 1];
        const c1x = p1.x + (p2.x - p0.x) * tension;
        const c1y = p1.y + (p2.y - p0.y) * tension;
        const c2x = p2.x - (p3.x - p1.x) * tension;
        const c2y = p2.y - (p3.y - p1.y) * tension;
        d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      line.querySelector("path").setAttribute("d", d);
    }

    function layoutVideo() {
      if (!open || video.hidden || !video.videoWidth) return;
      const bounds = stage.getBoundingClientRect();
      const ratio = video.videoWidth / video.videoHeight;
      const maxH = Math.max(140, bounds.height - 24);
      let width = bounds.width;
      let height = width / ratio;
      if (height > maxH) {
        height = maxH;
        width = height * ratio;
      }
      video.style.width = width + "px";
      video.style.height = height + "px";
    }

    function showCheckpoint(n) {
      open = true;
      closing = false;
      document.body.classList.add("locked");
      stage.hidden = false;
      replay.hidden = true;
      videoError.hidden = true;
      theme.setAttribute("content", "#b9e7f6");
      const src = videos[n];
      if (src) {
        stage.classList.remove("is-stub");
        stub.hidden = true;
        video.hidden = false;
        spinner.hidden = false;
        if (video.getAttribute("src") !== src) video.src = src;
        else video.currentTime = 0;
        layoutVideo();
        const attempt = video.play();
        if (attempt) attempt.catch(() => { spinner.hidden = true; });
      } else {
        video.pause();
        stage.classList.add("is-stub");
        video.hidden = true;
        spinner.hidden = true;
        stub.hidden = false;
        stubName.textContent = labels.get(document.querySelector(`.cp[data-n="${n}"]`));
      }
      document.querySelector("#close").focus();
    }

    function hideStage() {
      if (!open) return;
      open = false;
      video.pause();
      stage.hidden = true;
      stage.classList.remove("is-stub");
      document.body.classList.remove("locked");
      theme.setAttribute("content", "#b9e7f6");
    }

    function openCheckpoint(n) {
      showCheckpoint(n);
      if (!history.state || history.state.cp == null) history.pushState({ cp: n }, "");
      else history.replaceState({ cp: n }, "");
    }

    function requestClose() {
      if (!open || closing) return;
      if (history.state && history.state.cp != null) {
        closing = true;
        history.back();
      } else {
        hideStage();
      }
    }

    document.querySelector("#close").addEventListener("click", requestClose);
    document.querySelector("#back").addEventListener("click", requestClose);
    document.querySelector("#replay").addEventListener("click", () => {
      video.currentTime = 0;
      video.play();
    });

    video.addEventListener("loadedmetadata", layoutVideo);
    video.addEventListener("playing", () => {
      spinner.hidden = true;
      replay.hidden = true;
    });
    video.addEventListener("play", () => { replay.hidden = true; });
    video.addEventListener("ended", () => {
      replay.hidden = false;
    });
    video.addEventListener("error", () => {
      spinner.hidden = true;
      if (open && !video.hidden) videoError.hidden = false;
    });
    window.addEventListener("resize", () => {
      layoutStops();
      layoutVideo();
    });
    window.addEventListener("popstate", () => {
      closing = false;
      hideStage();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && open) requestClose();
    });

    layoutStops();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutStops);
  </script>
</body>
</html>
