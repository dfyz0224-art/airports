<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c1dffb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Чекпоинты">
  <title>Чекпоинты</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23145680'/%3E%3Cpath fill='white' d='M32 6c1.6 0 2.8 3 2.8 8v7l12 4c7 2 9 6 9 10l-1 4-20-3v9l7 5v4l-10-3-10 3v-4l7-5v-9l-20 3-1-4c0-4 2-8 9-10l12-4v-7c0-5 1.2-8 2.8-8z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #c1dffb;
      --ink: #143d5c;
      --muted: #3d6d88;
      --line: #14608a;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper) url("assets/bg.png") center / cover no-repeat;
    }

    body {
      height: 100dvh;
      font-family: "Nunito", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    body.locked { overflow: hidden; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .route {
      position: relative;
      width: min(440px, 100%);
      height: 100%;
      margin: 0 auto;
      overflow: hidden;
      padding:
        calc(12px + env(safe-area-inset-top))
        calc(6px + env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        calc(6px + env(safe-area-inset-left));
      user-select: none;
    }

    .line {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .line path {
      fill: none;
      stroke: var(--line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 10;
    }

    .cp {
      position: absolute;
      z-index: 1;
      left: 50%;
      width: fit-content;
      max-width: calc(100% - 24px);
      border: 0;
      border-radius: calc(16px * var(--fit, 1));
      padding: calc(7px * var(--fit, 1)) calc(12px * var(--fit, 1));
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      font-size: calc(15px * var(--fit, 1));
      line-height: 1.2;
      text-align: center;
      translate: -50% 0;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(16, 70, 100, 0.12);
      touch-action: manipulation;
    }

    .mark {
      position: absolute;
      top: 50%;
      height: var(--mark, 86px);
      width: max-content;
    }

    .cp[data-side="left"] .mark { left: 0; translate: calc(-100% - 4px) -58%; }
    .cp[data-side="right"] .mark { right: 0; translate: calc(100% + 4px) -58%; }
    .cp[data-side="center"] .mark {
      left: 50%;
      right: auto;
      top: auto;
      bottom: calc(100% + 2px);
      translate: -50% 0;
    }

    .mark img {
      display: block;
      height: 100%;
      width: auto;
      filter: drop-shadow(0 3px 6px rgba(16, 70, 100, 0.16));
    }

    .cp:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .cp:hover { scale: 1.03; }
    }

    .cp:active { scale: 0.98; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      overflow: hidden;
      overscroll-behavior: contain;
    }

    #stage.is-video {
      background: var(--paper) url("assets/bg.png") center / cover no-repeat;
    }

    #stage.is-stub::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(16, 55, 80, 0.22);
      z-index: 1;
    }

    #stage.is-stub .film {
      display: none;
    }

    #close {
      position: absolute;
      z-index: 5;
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      touch-action: manipulation;
    }

    #close svg { width: 22px; height: 22px; display: block; }

    #close:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .film {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #stage.is-video .film {
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
      padding:
        calc(68px + env(safe-area-inset-top))
        0
        calc(18px + env(safe-area-inset-bottom));
      gap: 16px;
    }

    .brand {
      width: min(84vw, 340px);
      height: auto;
      display: block;
    }

    .screen {
      position: relative;
      width: fit-content;
      max-width: 100%;
    }

    .points {
      width: min(92vw, 420px);
      margin: 0;
      padding: 0 22px 0 40px;
      color: var(--ink);
      font-weight: 800;
      font-size: clamp(15px, 4.1vw, 18px);
      line-height: 1.35;
    }

    .points li + li {
      margin-top: 8px;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: transparent;
      object-fit: contain;
      max-height: 100%;
    }

    #spinner,
    #replay {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(20, 61, 92, 0.2);
      border-top-color: var(--ink);
      animation: spin 0.8s linear infinite;
    }

    #replay {
      border: 0;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      font-size: 18px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      touch-action: manipulation;
    }

    #stub {
      position: relative;
      z-index: 2;
      width: min(86vw, 340px);
      margin: 24px;
      background: #f7fcff;
      color: var(--ink);
      border-radius: 28px;
      padding: 26px 22px 22px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(16, 55, 80, 0.22);
    }

    .stub-plane {
      width: 54px;
      height: 54px;
      display: block;
      margin: 0 auto 8px;
      fill: var(--ink);
    }

    #stub .eyebrow {
      margin: 0;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.3;
      color: #1d6f96;
    }

    #stub h2 {
      margin: 8px 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 900;
    }

    #stub .note {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.4;
      color: var(--muted);
    }

    #back, #video-error {
      font: inherit;
    }

    #back {
      appearance: none;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      border-radius: 999px;
      padding: 12px 22px;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #back:focus-visible,
    #replay:focus-visible {
      outline: 3px solid #7ac9d8;
      outline-offset: 3px;
    }

    #video-error {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #8d2d2d;
      font-weight: 800;
      text-align: center;
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #spinner { animation: none; }
      .cp, .cp:hover, .cp:active { transition: none; }
    }
  </style>
</head>
<body>
  <main class="route">
    <h1 class="sr-only">Чекпоинты</h1>
    <svg class="line" aria-hidden="true" focusable="false">
      <path class="spine"/>
      <path class="branch"/>
      <path class="branch"/>
      <path class="branch"/>
    </svg>
    <button class="cp" type="button" data-n="1" data-side="left">
      <span class="mark" aria-hidden="true"><img src="assets/icon-1.png?v=3" alt=""></span>
      <span class="name">На привокзальной площади</span>
    </button>
    <button class="cp" type="button" data-n="2" data-side="right">
      <span class="mark" aria-hidden="true"><img src="assets/icon-2.png?v=3" alt=""></span>
      <span class="name">Входной досмотр</span>
    </button>
    <button class="cp" type="button" data-n="3" data-side="left">
      <span class="mark" aria-hidden="true"><img src="assets/icon-3.png?v=3" alt=""></span>
      <span class="name">Регистрация на рейс</span>
    </button>
    <button class="cp" type="button" data-n="4" data-side="right">
      <span class="mark" aria-hidden="true"><img src="assets/icon-4.png?v=3" alt=""></span>
      <span class="name">Комната матери и ребенка</span>
    </button>
    <button class="cp" type="button" data-n="5" data-side="left">
      <span class="mark" aria-hidden="true"><img src="assets/icon-5.png?v=3" alt=""></span>
      <span class="name">Предполетный досмотр</span>
    </button>
    <button class="cp" type="button" data-n="6" data-side="right">
      <span class="mark" aria-hidden="true"><img src="assets/icon-6.png?v=3" alt=""></span>
      <span class="name">В ожидании вылета</span>
    </button>
    <button class="cp" type="button" data-n="7" data-side="left">
      <span class="mark" aria-hidden="true"><img src="assets/icon-7.png?v=3" alt=""></span>
      <span class="name">Приоритетная посадка</span>
    </button>
    <button class="cp" type="button" data-n="8" data-side="right">
      <span class="mark" aria-hidden="true"><img src="assets/icon-8.png?v=3" alt=""></span>
      <span class="name">Для прилетевших пассажиров</span>
    </button>
    <button class="cp" type="button" data-n="9" data-side="left">
      <span class="mark" aria-hidden="true"><img src="assets/icon-9.png?v=3" alt=""></span>
      <span class="name">Комплексная поддержка пассажиров с детьми</span>
    </button>
  </main>

  <div id="stage" hidden>
    <button id="close" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="film">
      <img class="brand" src="assets/logo.png" alt="Аэропорты Регионов" hidden>
      <div class="screen">
        <video id="video" hidden playsinline webkit-playsinline controls preload="auto"></video>
        <div id="spinner" hidden></div>
        <button id="replay" type="button" hidden>Ещё раз</button>
      </div>
      <ul class="points" hidden>
        <li>Отдельные места рядом с терминалом</li>
        <li>Специальная навигация и знаки</li>
        <li>Детская площадка на привокзальной площади</li>
      </ul>
    </div>
    <p id="video-error" hidden>Не удалось открыть видео</p>
    <div id="stub" hidden>
      <svg class="stub-plane" viewBox="-32 -34 64 68" aria-hidden="true">
        <path d="M0-30c2 0 3.4 4 3.4 12l.2 8 13-4c8-2 14 2 14 8l-1 4-25 3v8l8 5v3l-10-3-10 3v-3l8-5v-8l-25-3-1-4c0-6 6-10 14-8l13 4 .2-8c0-8 1.4-12 3.4-12z"/>
      </svg>
      <p class="eyebrow" id="stub-name">Входной досмотр</p>
      <h2>Видео ещё в пути</h2>
      <p class="note">Ролик для этой точки появится позже.</p>
      <button id="back" type="button">На карту</button>
    </div>
  </div>

  <script>
    const videos = {
      1: "assets/videoplanes.mp4"
    };

    const stage = document.querySelector("#stage");
    const film = document.querySelector(".film");
    const brand = document.querySelector(".brand");
    const points = document.querySelector(".points");
    const video = document.querySelector("#video");
    const stub = document.querySelector("#stub");
    const spinner = document.querySelector("#spinner");
    const replay = document.querySelector("#replay");
    const stubName = document.querySelector("#stub-name");
    const videoError = document.querySelector("#video-error");
    const theme = document.querySelector('meta[name="theme-color"]');
    const route = document.querySelector(".route");
    const line = document.querySelector(".line");
    let open = false;
    let closing = false;

    const labels = new Map();
    const ruler = document.createElement("span");
    ruler.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;visibility:hidden;pointer-events:none;";
    document.body.appendChild(ruler);

    const shifts = { 1: -62, 2: 70, 3: -74, 4: 66, 5: -70, 6: 64, 7: -68, 8: 72 };
    const gapWeights = [0.42, 0.95, 0.62, 1.28, 0.58, 1.16, 0.86];

    document.querySelectorAll(".cp").forEach((button) => {
      const n = button.dataset.n;
      const label = button.querySelector(".name").textContent.trim();
      labels.set(button, label);
      button.setAttribute("aria-label", n === "1" ? label + ", смотреть видео" : label);
      button.addEventListener("click", () => openCheckpoint(Number(n)));
    });

    function measure(text, button) {
      ruler.textContent = text;
      ruler.style.font = getComputedStyle(button).font;
      return ruler.offsetWidth;
    }

    function fitLabel(button) {
      const words = labels.get(button).split(/\s+/);
      const style = getComputedStyle(button);
      const pad = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const n = button.dataset.n;
      const limit = n === "9"
        ? Math.min(route.clientWidth - 36, 250)
        : Math.min(route.clientWidth * 0.36, 132);
      const lineOf = (list) => measure(list.join(" "), button);
      button.style.maxWidth = "none";
      const name = button.querySelector(".name");
      const hug = () => {
        const range = document.createRange();
        range.selectNodeContents(name);
        const widest = Math.max(...[...range.getClientRects()].map((rect) => rect.width).filter((width) => width > 2));
        button.style.width = Math.ceil(widest + pad) + "px";
      };
      if (words.length < 2 || lineOf(words) + pad <= limit) {
        name.replaceChildren(document.createTextNode(labels.get(button)));
        button.style.width = Math.ceil(lineOf(words) + pad + 8) + "px";
        hug();
        return;
      }
      let best = Infinity;
      let split = 1;
      for (let i = 1; i < words.length; i++) {
        const widest = Math.max(lineOf(words.slice(0, i)), lineOf(words.slice(i)));
        if (widest < best) {
          best = widest;
          split = i;
        }
      }
      name.replaceChildren(
        document.createTextNode(words.slice(0, split).join(" ")),
        document.createElement("br"),
        document.createTextNode(words.slice(split).join(" "))
      );
      button.style.width = Math.ceil(best + pad + 8) + "px";
      hug();
    }

    function layoutStops() {
      const padTop = parseFloat(getComputedStyle(route).paddingTop);
      const padBottom = parseFloat(getComputedStyle(route).paddingBottom);
      const rowIds = [8, 7, 6, 5, 4, 3, 2, 1];
      const rows = rowIds.map((id) => document.querySelector(`.cp[data-n="${id}"]`));
      const crown = document.querySelector('.cp[data-n="9"]');
      let bottomGap = Math.round(Math.min(48, Math.max(28, route.clientHeight * 0.05)));
      let fit = 1;
      let mark = 96;
      const objectWidth = (button) => {
        const img = button.querySelector("img");
        const ratio = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 1.3;
        return mark * ratio;
      };
      const fits = () => {
        route.style.setProperty("--fit", String(fit));
        route.style.setProperty("--mark", mark + "px");
        document.querySelectorAll(".cp").forEach(fitLabel);
        const heights = rows.map((button) => button.offsetHeight);
        const minGap = 8;
        const stack = heights.reduce((sum, height) => sum + height, 0) + minGap * (rows.length - 1);
        const crownBand = mark + crown.offsetHeight + 22;
        const available = route.clientHeight - padTop - padBottom - bottomGap - crownBand;
        if (stack > available) return false;
        for (let i = 0; i < rows.length - 2; i++) {
          const span = heights[i] / 2 + minGap + heights[i + 1] + minGap + heights[i + 2] / 2;
          if (span < mark * 0.9) return false;
        }
        const half = route.clientWidth / 2;
        const inset = 8;
        for (const button of rows) {
          const outside = objectWidth(button) + 4;
          const room = route.clientWidth - inset * 2 - button.offsetWidth;
          if (outside > room) return false;
          const minX = inset + outside + button.offsetWidth / 2 - half;
          const maxX = half - inset - outside - button.offsetWidth / 2;
          if (minX > maxX) return false;
        }
        return objectWidth(crown) < route.clientWidth - 16;
      };
      for (let attempt = 0; attempt < 24; attempt++) {
        if (fits()) break;
        if (fit > 0.9) fit = Math.round((fit - 0.02) * 100) / 100;
        else if (mark > 84) mark -= 4;
        else if (fit > 0.84) fit = Math.round((fit - 0.02) * 100) / 100;
        else if (mark > 72) mark -= 4;
        else if (bottomGap > 18) bottomGap -= 4;
        else break;
      }
      route.style.setProperty("--fit", String(fit));
      route.style.setProperty("--mark", mark + "px");
      document.querySelectorAll(".cp").forEach(fitLabel);
      const half = route.clientWidth / 2;
      const inset = 8;
      const setX = (button, x) => {
        button.dataset.x = String(x);
        button.style.translate = `calc(-50% + ${x}px) 0`;
        button.dataset.side = x < 0 ? "left" : "right";
      };
      const shiftFor = (button) => {
        const preferred = shifts[button.dataset.n];
        const outside = objectWidth(button) + 4;
        const pillW = button.offsetWidth;
        if (preferred < 0) {
          const minX = inset + outside + pillW / 2 - half;
          const maxX = half - inset - pillW / 2;
          return Math.max(minX, Math.min(preferred, maxX));
        }
        const maxX = half - inset - outside - pillW / 2;
        const minX = inset + pillW / 2 - half;
        return Math.min(maxX, Math.max(preferred, minX));
      };
      crown.dataset.side = "center";
      crown.dataset.x = "0";
      crown.style.translate = "-50% 0";
      crown.style.top = (padTop + mark + 4) + "px";
      const heights = rows.map((button) => button.offsetHeight);
      const minGap = 8;
      const firstLift = Math.max(0, mark / 2 - heights[0] / 2);
      let y = padTop + mark + 4 + crown.offsetHeight + 12 + firstLift;
      const content = heights.reduce((sum, height) => sum + height, 0) + minGap * (rows.length - 1);
      const lastDrop = Math.max(0, mark / 2 - heights[heights.length - 1] / 2);
      const free = Math.max(0, route.clientHeight - padBottom - bottomGap - lastDrop - y - content);
      const weightSum = gapWeights.reduce((sum, weight) => sum + weight, 0);
      rows.forEach((button, index) => {
        setX(button, shiftFor(button));
        button.style.top = y + "px";
        y += heights[index];
        if (index < gapWeights.length) y += minGap + free * gapWeights[index] / weightSum;
      });
      layoutLine();
    }

    function curveThrough(points, tension = 0.24) {
      let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || points[i + 1];
        const c1x = p1.x + (p2.x - p0.x) * tension;
        const c1y = p1.y + (p2.y - p0.y) * tension;
        const c2x = p2.x - (p3.x - p1.x) * tension;
        const c2y = p2.y - (p3.y - p1.y) * tension;
        d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }
      return d;
    }

    function layoutLine() {
      const box = route.getBoundingClientRect();
      const spot = (n) => {
        const rect = document.querySelector(`.cp[data-n="${n}"]`).getBoundingClientRect();
        return {
          l: rect.left - box.left,
          t: rect.top - box.top,
          r: rect.right - box.left,
          b: rect.bottom - box.top,
          x: rect.left + rect.width / 2 - box.left,
          y: rect.top + rect.height / 2 - box.top
        };
      };
      const p = {};
      for (let n = 1; n <= 8; n++) p[n] = spot(n);
      const c = (n) => ({ x: p[n].x, y: p[n].y });
      const stem = (a, b, c1, c2) => {
        const f = (n) => n.toFixed(1);
        return `M ${f(a.x)} ${f(a.y)} C ${f(c1.x)} ${f(c1.y)}, ${f(c2.x)} ${f(c2.y)}, ${f(b.x)} ${f(b.y)}`;
      };
      const scale = box.width / 390;
      const node = { x: p[6].x, y: p[6].t - 8 * scale };
      const neckFrom = { x: p[6].x, y: p[6].t + 7 * scale };
      const left = { x: p[7].x - (p[7].x - p[7].l) * 0.15, y: p[7].b - 5 * scale };
      const right = { x: p[8].x + (p[8].r - p[8].x) * 0.2, y: p[8].b - 5 * scale };
      const neck = stem(
        neckFrom,
        node,
        { x: node.x, y: (neckFrom.y + node.y) / 2 },
        { x: node.x, y: (neckFrom.y + node.y) / 2 }
      );
      line.querySelector(".spine").setAttribute("d", curveThrough([1, 2, 3, 4, 5, 6].map(c)) + " " + neck);
      const branches = line.querySelectorAll(".branch");
      const lane = Math.max(node.x + 14 * scale, p[7].r + 12 * scale);
      branches[0].setAttribute("d", stem(
        node,
        left,
        { x: node.x + (left.x - node.x) * 0.38 - 16 * scale, y: node.y + (left.y - node.y) * 0.55 },
        { x: left.x - 10 * scale, y: left.y + 18 * scale }
      ));
      branches[1].setAttribute("d", stem(
        node,
        right,
        { x: lane, y: node.y + (right.y - node.y) * 0.42 },
        { x: Math.max(right.x, lane - 6 * scale), y: right.y + 16 * scale }
      ));
      branches[2].setAttribute("d", "");
    }

    function layoutVideo() {
      if (!open || video.hidden || !video.videoWidth) return;
      const bounds = stage.getBoundingClientRect();
      const filmStyle = getComputedStyle(film);
      const padY = parseFloat(filmStyle.paddingTop) + parseFloat(filmStyle.paddingBottom);
      const gap = parseFloat(filmStyle.rowGap || filmStyle.gap) || 0;
      const extras = [brand, points].reduce((sum, el) => sum + (el.hidden ? 0 : el.offsetHeight), 0);
      const visible = [brand, points].filter((el) => !el.hidden).length + 1;
      const maxH = Math.max(110, bounds.height - padY - extras - gap * (visible - 1) - 4);
      const innerW = bounds.width - parseFloat(filmStyle.paddingLeft) - parseFloat(filmStyle.paddingRight);
      const ratio = video.videoWidth / video.videoHeight;
      let width = innerW;
      let height = width / ratio;
      if (height > maxH) {
        height = maxH;
        width = height * ratio;
      }
      video.style.width = width + "px";
      video.style.height = height + "px";
    }

    function showCheckpoint(n) {
      open = true;
      closing = false;
      document.body.classList.add("locked");
      stage.hidden = false;
      replay.hidden = true;
      videoError.hidden = true;
      theme.setAttribute("content", "#c1dffb");
      const src = videos[n];
      if (src) {
        stage.classList.remove("is-stub");
        stage.classList.add("is-video");
        const parking = n === 1;
        brand.hidden = !parking;
        points.hidden = !parking;
        stub.hidden = true;
        video.hidden = false;
        spinner.hidden = false;
        if (video.getAttribute("src") !== src) video.src = src;
        else video.currentTime = 0;
        layoutVideo();
        const attempt = video.play();
        if (attempt) attempt.catch(() => { spinner.hidden = true; });
      } else {
        video.pause();
        brand.hidden = true;
        points.hidden = true;
        stage.classList.remove("is-video");
        stage.classList.add("is-stub");
        theme.setAttribute("content", "#c1dffb");
        video.hidden = true;
        spinner.hidden = true;
        stub.hidden = false;
        stubName.textContent = labels.get(document.querySelector(`.cp[data-n="${n}"]`));
      }
      document.querySelector("#close").focus();
    }

    function hideStage() {
      if (!open) return;
      open = false;
      video.pause();
      stage.hidden = true;
      stage.classList.remove("is-stub");
      stage.classList.remove("is-video");
      document.body.classList.remove("locked");
      theme.setAttribute("content", "#c1dffb");
    }

    function openCheckpoint(n) {
      showCheckpoint(n);
      if (!history.state || history.state.cp == null) history.pushState({ cp: n }, "");
      else history.replaceState({ cp: n }, "");
    }

    function requestClose() {
      if (!open || closing) return;
      if (history.state && history.state.cp != null) {
        closing = true;
        history.back();
      } else {
        hideStage();
      }
    }

    document.querySelector("#close").addEventListener("click", requestClose);
    document.querySelector("#back").addEventListener("click", requestClose);
    document.querySelector("#replay").addEventListener("click", () => {
      video.currentTime = 0;
      video.play();
    });

    video.addEventListener("loadedmetadata", layoutVideo);
    brand.addEventListener("load", layoutVideo);
    video.addEventListener("playing", () => {
      spinner.hidden = true;
      replay.hidden = true;
    });
    video.addEventListener("play", () => { replay.hidden = true; });
    video.addEventListener("ended", () => {
      replay.hidden = false;
    });
    video.addEventListener("error", () => {
      spinner.hidden = true;
      if (open && !video.hidden) videoError.hidden = false;
    });
    window.addEventListener("resize", () => {
      layoutStops();
      layoutVideo();
    });
    window.addEventListener("popstate", () => {
      closing = false;
      hideStage();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && open) requestClose();
    });

    document.querySelectorAll(".mark img").forEach((img) => {
      if (!img.complete) img.addEventListener("load", layoutStops);
    });
    layoutStops();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutStops);
  </script>
</body>
</html>
